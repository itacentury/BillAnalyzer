{% from "partials/_macros.html" import category_combobox %}
<!-- Filters -->
<div class="filters">
  <div class="filters-row">
    <!-- Period segment -->
    <div class="quick-filters">
      <button class="quick-filter-btn" data-filter="week">Week</button>
      <button class="quick-filter-btn active" data-filter="month">Month</button>
      <button class="quick-filter-btn" data-filter="year">Year</button>
      <button class="quick-filter-btn" data-filter="all">All</button>
    </div>

    <!-- Period navigator -->
    <div class="month-navigator">
      <button
        class="month-nav-btn"
        data-action="nav-prev"
        aria-label="Previous"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <div class="month-display" data-el="month-display">January 2026</div>
      <button class="month-nav-btn" data-action="nav-next" aria-label="Next">
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </div>
    <button class="month-reset-btn" data-action="nav-reset">
      Current Month
    </button>

    <!-- Search -->
    <div class="filter-search">
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        type="text"
        class="filter-search-input"
        data-el="search"
        placeholder="Search store or item…"
      />
    </div>

    <!-- Filter panel toggle -->
    <button class="filter-button" data-el="filters-toggle">
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
      </svg>
      <span>Filter</span>
      <span class="filter-badge" data-el="filter-badge" hidden>0</span>
    </button>
  </div>

  <!-- Collapsible filter panel -->
  <div class="filters-collapsible" data-el="filters-collapsible">
    <div class="filters-collapsible-inner">
      <div class="filters-panel">
        <div class="form-group">
          <label class="form-label">Store</label>
          <select class="form-select" data-el="store-filter">
            <option value="">All Stores</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          {{ category_combobox("type-filter", "filter") }}
        </div>
        <div class="form-group">
          <label class="form-label">From</label>
          <input type="date" class="form-input" data-el="date-from" />
        </div>
        <div class="form-group">
          <label class="form-label">To</label>
          <input type="date" class="form-input" data-el="date-to" />
        </div>
        <div class="form-group">
          <label class="form-label">Sort By</label>
          <input type="hidden" data-el="sort-by" value="date" />
          <div class="pill-group" role="group" aria-label="Sort by">
            <button type="button" class="pill active" data-sort="date">
              Date
            </button>
            <button type="button" class="pill" data-sort="store">Store</button>
            <button type="button" class="pill" data-sort="total">Amount</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Order</label>
          <input type="hidden" data-el="sort-order" value="desc" />
          <div class="pill-group" role="group" aria-label="Order">
            <button type="button" class="pill active" data-order="desc">
              ↓ Desc
            </button>
            <button type="button" class="pill" data-order="asc">↑ Asc</button>
          </div>
        </div>
      </div>
      <div class="filter-reset-row">
        <button
          class="btn btn-secondary btn-sm filter-reset-btn"
          data-action="reset-filters"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          Reset Filters
        </button>
      </div>
    </div>
  </div>
</div>
