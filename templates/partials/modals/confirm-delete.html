<!-- Confirm Delete Modal -->
<div class="modal-overlay" data-el="confirm-delete-modal">
  <div class="modal modal-sm">
    <div class="modal-body confirm-delete-body">
      <div class="confirm-delete-icon">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="3 6 5 6 21 6" />
          <path
            d="m19 6-.867 12.142A2 2 0 0 1 16.138 20H7.862a2 2 0 0 1-1.995-1.858L5 6"
          />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
      </div>
      <h3 class="confirm-delete-title" data-el="confirm-delete-modal-title">
        Confirm Deletion
      </h3>
      <p class="confirm-delete-message" data-el="confirm-delete-modal-message">
        Are you sure you want to delete this entry?
      </p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-action="cancel">Cancel</button>
      <button class="btn btn-danger-solid" data-action="confirm">Delete</button>
    </div>
  </div>
</div>
