{% from "partials/_macros.html" import modal_close_button %}
<!-- Import Modal -->
<div class="modal-overlay" data-el="import-modal">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="import-title"
  >
    <div class="modal-header">
      <h3 class="modal-title" id="import-title">JSON Import</h3>
      {{ modal_close_button() }}
    </div>
    <div class="modal-body">
      <div data-el="import-input">
        <div class="dropzone" data-el="dropzone">
          <div class="dropzone-icon">
            <svg
              width="26"
              height="26"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
          </div>
          <div class="dropzone-text">
            Drag JSON files here or click to select<br /><small
              style="color: var(--text-muted)"
              >Multiple files supported</small
            >
          </div>
          <input
            type="file"
            data-el="file-input"
            accept=".json"
            multiple
            style="display: none"
          />
        </div>
        <div
          data-el="selected-files"
          style="display: none; margin-bottom: 1rem"
        ></div>
        <div class="form-group">
          <label class="form-label">Or paste JSON directly</label>
          <textarea
            class="form-input json-textarea"
            data-el="json-input"
            data-autofocus
            placeholder='[{"date": "2024-01-01", "store": "...", "total": "...", "items": [...]}]'
          ></textarea>
        </div>
      </div>
      <div
        class="import-errors"
        data-el="import-errors"
        style="display: none"
      ></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-action="cancel">Cancel</button>
      <button class="btn btn-primary" data-action="import">Import</button>
    </div>
  </div>
</div>
