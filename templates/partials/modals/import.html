<!-- Import Modal -->
<div class="modal-overlay" data-el="import-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">JSON Import</h3>
      <button class="modal-close">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="dropzone" data-el="dropzone">
        <div class="dropzone-icon">📁</div>
        <div class="dropzone-text">
          Drag JSON files here or click to select<br /><small
            style="color: var(--text-muted)"
            >Multiple files supported</small
          >
        </div>
        <input
          type="file"
          data-el="file-input"
          accept=".json"
          multiple
          style="display: none"
        />
      </div>
      <div
        data-el="selected-files"
        style="display: none; margin-bottom: 1rem"
      ></div>
      <div class="form-group">
        <label class="form-label">Or paste JSON directly</label>
        <textarea
          class="form-input json-textarea"
          data-el="json-input"
          placeholder='[{"date": "2024-01-01", "store": "...", "total": "...", "items": [...]}]'
        ></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-action="cancel">Cancel</button>
      <button class="btn btn-primary" data-action="import">Import</button>
    </div>
  </div>
</div>
