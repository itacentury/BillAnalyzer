<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">&Sigma;</div>
    <h1 class="sidebar-title">Summa</h1>
  </div>

  <nav class="sidebar-nav">
    <button class="nav-item active" data-view="invoices">
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
      </svg>
      <span>Invoices</span>
    </button>
    <button class="nav-item" data-view="stats">
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="18" y1="20" x2="18" y2="10" />
        <line x1="12" y1="20" x2="12" y2="4" />
        <line x1="6" y1="20" x2="6" y2="14" />
      </svg>
      <span>Statistics</span>
    </button>
  </nav>

  <div class="sidebar-actions">
    <button
      class="sidebar-action-btn"
      data-action="open-import"
      title="JSON Import"
    >
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      <span>Import</span>
    </button>
    <button
      class="sidebar-action-btn sidebar-action-primary"
      data-action="open-add"
      title="New Invoice"
    >
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      <span>New Invoice</span>
    </button>
  </div>
</aside>

<!-- Mobile-only floating actions: New (primary) with Import above it. -->
<div class="fab-cluster">
  <button
    class="fab fab-secondary"
    data-action="open-import"
    aria-label="JSON Import"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="17 8 12 3 7 8" />
      <line x1="12" y1="3" x2="12" y2="15" />
    </svg>
  </button>
  <button
    class="fab fab-primary"
    data-action="open-add"
    aria-label="New Invoice"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </svg>
  </button>
</div>
